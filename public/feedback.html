<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torniquete Link - Pantalla de Visualización</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-dark: #050710;
      --accent-blue: #00d2ff;
      --accent-green: #00e676;
      --accent-red: #ff1744;
      
      --gradient-standby: radial-gradient(circle at center, #0b1437 0%, #050710 100%);
      --gradient-verifying: linear-gradient(135deg, #091e3a 0%, #1e3a8a 50%, #0284c7 100%);
      --gradient-success: linear-gradient(135deg, #004d40 0%, #00e676 100%);
      --gradient-denied: linear-gradient(135deg, #b71c1c 0%, #ff1744 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      color: #ffffff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background 0.8s ease;
    }

    /* Screen Wrapper States */
    .screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: var(--gradient-standby);
      position: relative;
    }

    .screen.state-verifying {
      background: var(--gradient-verifying);
    }

    .screen.state-success {
      background: var(--gradient-success);
    }

    .screen.state-denied {
      background: var(--gradient-denied);
      animation: shake 0.5s ease-in-out;
    }

    /* Container for layout */
    .content-box {
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    /* Icons and Animations */
    .icon-container {
      width: 25vmin;
      height: 25vmin;
      max-width: 130px;
      max-height: 130px;
      min-width: 80px;
      min-height: 80px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.5rem;
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      transition: all 0.5s ease;
    }

    .icon-container i {
      width: 50% !important;
      height: 50% !important;
    }

    /* Standby pulse effect */
    .state-standby .icon-container {
      animation: pulse-blue 2s infinite;
      color: var(--accent-blue);
    }

    .state-verifying .icon-container {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(56, 189, 248, 0.7);
      color: #38bdf8;
      transform: scale(1.08);
      box-shadow: 0 0 50px rgba(2, 132, 199, 0.65);
      animation: pulse-verifying 1.5s infinite;
    }

    .state-verifying .icon-container i {
      animation: spin-loader 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .state-success .icon-container {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
      color: #ffffff;
      transform: scale(1.1);
      box-shadow: 0 0 50px rgba(0, 230, 118, 0.5);
    }

    .state-denied .icon-container {
      background: rgba(0, 0, 0, 0.2);
      border-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      transform: scale(1.1);
      box-shadow: 0 0 50px rgba(255, 23, 68, 0.5);
    }

    /* Typography */
    .status-title {
      font-size: clamp(1.4rem, 4.5vmin, 2.2rem);
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 0.5rem;
    }

    .user-name {
      font-size: clamp(1.8rem, 7vmin, 3.2rem);
      font-weight: 800;
      margin: 0.5rem 0;
      text-shadow: 0 4px 10px rgba(0,0,0,0.3);
      line-height: 1.1;
      word-break: break-word;
    }

    .sub-message {
      font-size: clamp(1.1rem, 3.5vmin, 1.5rem);
      font-weight: 300;
      color: rgba(255, 255, 255, 0.85);
      max-width: 600px;
    }

    .state-verifying .sub-message {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #e0f2fe;
      font-size: 1.15rem;
      letter-spacing: 0.5px;
    }

    .reason-box {
      font-family: 'JetBrains Mono', monospace;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 1.2rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 1rem;
      color: #ffeb3b;
    }

    /* Device pill selector at top-left */
    .device-pill {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #ffffff;
      padding: 0.5rem 1rem;
      border-radius: 24px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      z-index: 10;
      transition: all 0.25s ease;
      font-size: 0.85rem;
      font-family: inherit;
    }

    .device-pill:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: var(--accent-blue);
      transform: translateY(-1px);
    }

    /* Floating Fullscreen Button */
    .fullscreen-btn {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 0.75rem;
      border-radius: 50%;
      cursor: pointer;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .fullscreen-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.1);
      box-shadow: 0 6px 15px rgba(0, 210, 255, 0.4);
    }

    /* Opacidad reducida en modo pantalla completa */
    body.is-fullscreen .device-pill,
    body.is-fullscreen .fullscreen-btn,
    :fullscreen .device-pill,
    :fullscreen .fullscreen-btn {
      opacity: 0.2;
    }

    body.is-fullscreen .device-pill:hover,
    body.is-fullscreen .fullscreen-btn:hover,
    :fullscreen .device-pill:hover,
    :fullscreen .fullscreen-btn:hover {
      opacity: 1;
    }

    /* Modal Overlay for Device Selection */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 150;
      padding: 1rem;
      opacity: 1;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.hidden {
      display: none;
      opacity: 0;
      pointer-events: none;
    }

    .modal-box {
      background: #0c1228;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 1.5rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 0.75rem;
    }

    .device-option-btn {
      width: 100%;
      padding: 0.85rem 1rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .device-option-btn:hover {
      background: rgba(0, 210, 255, 0.12);
      border-color: var(--accent-blue);
      transform: translateX(3px);
    }

    .device-option-btn.active {
      background: rgba(0, 210, 255, 0.2);
      border-color: var(--accent-blue);
    }

    /* Animations declaration */
    @keyframes pulse-blue {
      0% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0.4); }
      70% { box-shadow: 0 0 0 30px rgba(0, 210, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0); }
    }

    @keyframes pulse-verifying {
      0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.6); }
      70% { box-shadow: 0 0 0 30px rgba(56, 189, 248, 0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
    }

    @keyframes spin-loader {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
      20%, 40%, 60%, 80% { transform: translateX(10px); }
    }

    #sound-activation-banner {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: var(--accent-blue);
      color: var(--bg-dark);
      padding: 0.75rem;
      text-align: center;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <!-- Audio Activation Banner -->
  <div id="sound-activation-banner" onclick="enableAudio()">
    <i data-lucide="volume-2"></i>
    <span>Haga clic aquí para activar las alertas de sonido para la pantalla</span>
  </div>

  <!-- Device Selection Pill Button -->
  <button class="device-pill" id="btn-device-selector" onclick="openDeviceModal()" title="Configurar torniquete asignado a esta pantalla">
    <i data-lucide="cpu" style="width: 16px; height: 16px;"></i>
    <span id="current-device-label">Todos los Torniquetes</span>
    <i data-lucide="chevron-down" style="width: 14px; height: 14px; opacity: 0.7;"></i>
  </button>

  <!-- Floating Fullscreen Button -->
  <button class="fullscreen-btn" id="btn-fullscreen" onclick="toggleFullscreen()" title="Pantalla Completa">
    <i data-lucide="maximize" id="fullscreen-icon" style="width: 20px; height: 20px;"></i>
  </button>

  <!-- Screen Viewport -->
  <div class="screen state-standby" id="screen-viewport">
    <div class="content-box" id="container-box">
      
      <!-- Icon Container -->
      <div class="icon-container" id="icon-wrapper">
        <i data-lucide="scan" id="state-icon"></i>
      </div>

      <!-- Main Messages -->
      <h2 class="status-title" id="status-title" style="margin-top: 0.5rem;">Presente su Credencial</h2>
      <div id="standby-device-subtitle" style="font-size: 1.15rem; color: var(--accent-blue); font-weight: 500; display: none;"></div>
      <h1 class="user-name" id="user-display" style="display: none;"></h1>
      <p class="sub-message" id="sub-message" style="display: none;"></p>
      
      <!-- Reason (Shown only on Denied) -->
      <div class="reason-box" id="reason-container" style="display: none;"></div>

    </div>
  </div>

  <!-- Device Selector Modal -->
  <div id="device-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <i data-lucide="monitor" style="width: 20px; height: 20px; color: var(--accent-blue);"></i>
          <h3 style="font-size: 1.15rem; font-weight: 700; margin: 0;">Asignar Pantalla a Torniquete</h3>
        </div>
        <button onclick="closeDeviceModal()" style="background: none; border: none; color: #8fa0dd; cursor: pointer; display: flex; align-items: center;">
          <i data-lucide="x" style="width: 18px; height: 18px;"></i>
        </button>
      </div>

      <p style="font-size: 0.875rem; color: #8fa0dd; margin: 0;">
        Seleccione el torniquete físico que estará vinculado a este monitor o pantalla:
      </p>

      <div id="devices-options-list" style="display: flex; flex-direction: column; gap: 0.6rem; max-height: 280px; overflow-y: auto;">
        <div style="text-align: center; color: #8fa0dd; padding: 1rem;">Cargando torniquetes...</div>
      </div>
    </div>
  </div>

  <script>
    // Fullscreen API Handler
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.error(`Error al intentar activar pantalla completa: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const icon = document.getElementById('fullscreen-icon');
      if (document.fullscreenElement) {
        document.body.classList.add('is-fullscreen');
        icon.setAttribute('data-lucide', 'minimize');
      } else {
        document.body.classList.remove('is-fullscreen');
        icon.setAttribute('data-lucide', 'maximize');
      }
      lucide.createIcons();
    });

    // Web Audio Context for browser chimes
    let audioCtx = null;

    function enableAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      document.getElementById('sound-activation-banner').style.display = 'none';
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    // Play credential read acknowledgment beep
    function playReadBeep() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        osc.type = 'sine';
        osc.frequency.setValueAtTime(750, now);
        gainNode.gain.setValueAtTime(0.12, now);
        gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } catch (err) {
        console.warn('Audio read tone failed:', err);
      }
    }

    function playChime(success) {
      if (!audioCtx) return;
      try {
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc1.type = 'sine';
        osc2.type = 'triangle';
        osc1.connect(gainNode);
        osc2.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (success) {
          osc1.frequency.setValueAtTime(523.25, now); // C5
          osc2.frequency.setValueAtTime(659.25, now); // E5
          gainNode.gain.setValueAtTime(0.15, now);
          gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 0.6);
          osc2.stop(now + 0.6);
        } else {
          osc1.frequency.setValueAtTime(98.00, now); // G2
          osc2.frequency.setValueAtTime(103.83, now); // Ab2
          gainNode.gain.setValueAtTime(0.25, now);
          gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 0.8);
          osc2.stop(now + 0.8);
        }
      } catch (err) {
        console.error('Audio synthesis failed:', err);
      }
    }

    // Elements
    const screenViewport = document.getElementById('screen-viewport');
    const stateIcon = document.getElementById('state-icon');
    const statusTitle = document.getElementById('status-title');
    const userDisplay = document.getElementById('user-display');
    const subMessage = document.getElementById('sub-message');
    const reasonContainer = document.getElementById('reason-container');
    const iconWrapper = document.getElementById('icon-wrapper');
    const currentDeviceLabel = document.getElementById('current-device-label');
    const standbyDeviceSubtitle = document.getElementById('standby-device-subtitle');
    const deviceModal = document.getElementById('device-modal');
    const devicesOptionsList = document.getElementById('devices-options-list');

    let resetTimer = null;
    let availableDevices = [];
    let currentDeviceId = null; // null or 'all' for global, or specific number ID

    // Reset back to standby state
    function resetToStandby() {
      screenViewport.className = 'screen state-standby';
      iconWrapper.style.transform = 'scale(1)';
      stateIcon.setAttribute('data-lucide', 'scan');
      statusTitle.textContent = 'Presente su Credencial';
      statusTitle.style.display = 'block';

      if (currentDeviceId && currentDeviceId !== 'all') {
        const dev = availableDevices.find(d => String(d.id) === String(currentDeviceId));
        if (dev) {
          standbyDeviceSubtitle.textContent = `${dev.name}`;
          standbyDeviceSubtitle.style.display = 'block';
        } else {
          standbyDeviceSubtitle.style.display = 'none';
        }
      } else {
        standbyDeviceSubtitle.style.display = 'none';
      }

      userDisplay.style.display = 'none';
      userDisplay.textContent = '';
      subMessage.style.display = 'none';
      reasonContainer.style.display = 'none';
      reasonContainer.textContent = '';
      lucide.createIcons();
    }

    // Modal Handlers
    function openDeviceModal() {
      renderDeviceOptions();
      deviceModal.classList.remove('hidden');
    }

    function closeDeviceModal() {
      deviceModal.classList.add('hidden');
    }

    function selectDevice(devId) {
      currentDeviceId = devId;
      if (devId && devId !== 'all') {
        localStorage.setItem('feedback_device_id', String(devId));
        const newUrl = `${window.location.pathname}?device=${devId}`;
        window.history.replaceState({}, '', newUrl);
      } else {
        localStorage.removeItem('feedback_device_id');
        window.history.replaceState({}, '', window.location.pathname);
      }

      updateDeviceIndicator();
      resetToStandby();
      closeDeviceModal();
      connectSSE();
    }

    function updateDeviceIndicator() {
      if (currentDeviceId && currentDeviceId !== 'all') {
        const dev = availableDevices.find(d => String(d.id) === String(currentDeviceId));
        const name = dev ? dev.name : `Torniquete ID ${currentDeviceId}`;
        currentDeviceLabel.textContent = name;
        document.title = `${name} - Feedback`;
      } else {
        currentDeviceLabel.textContent = 'Todos los Torniquetes (Global)';
        document.title = 'Torniquete Link - Pantalla de Visualización';
      }
    }

    function renderDeviceOptions() {
      devicesOptionsList.innerHTML = '';

      // Global option
      const globalBtn = document.createElement('button');
      globalBtn.className = `device-option-btn ${(!currentDeviceId || currentDeviceId === 'all') ? 'active' : ''}`;
      globalBtn.innerHTML = `
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <i data-lucide="layers" style="width: 16px; height: 16px; color: var(--accent-blue);"></i>
          <strong>Todos los Torniquetes (Modo Global)</strong>
        </div>
        ${(!currentDeviceId || currentDeviceId === 'all') ? '<i data-lucide="check" style="width:16px;height:16px;color:var(--accent-green);"></i>' : ''}
      `;
      globalBtn.onclick = () => selectDevice('all');
      devicesOptionsList.appendChild(globalBtn);

      // Individual devices
      availableDevices.forEach(dev => {
        const isSelected = String(currentDeviceId) === String(dev.id);
        const btn = document.createElement('button');
        btn.className = `device-option-btn ${isSelected ? 'active' : ''}`;
        btn.innerHTML = `
          <div style="display: flex; align-items: center; gap: 0.6rem; text-align: left;">
            <i data-lucide="cpu" style="width: 18px; height: 18px; color: var(--accent-blue); flex-shrink: 0;"></i>
            <strong style="color: #ffffff; font-size: 0.95rem;">${escapeHTML(dev.name)}</strong>
          </div>
          ${isSelected ? '<i data-lucide="check" style="width:16px;height:16px;color:var(--accent-green); flex-shrink: 0;"></i>' : '<i data-lucide="chevron-right" style="width:14px;height:14px;opacity:0.4; flex-shrink: 0;"></i>'}
        `;
        btn.onclick = () => selectDevice(dev.id);
        devicesOptionsList.appendChild(btn);
      });

      lucide.createIcons();
    }

    async function loadDevices() {
      try {
        const res = await fetch('/api/devices');
        if (res.ok) {
          availableDevices = await res.json();
          updateDeviceIndicator();
          resetToStandby();
        }
      } catch (err) {
        console.warn('Error loading devices list:', err);
      }
    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Trigger Verifying / Pending State (Credential read, waiting for external API)
    function showVerifying(name, userId, deviceName) {
      if (resetTimer) clearTimeout(resetTimer);

      screenViewport.className = 'screen state-verifying';
      stateIcon.setAttribute('data-lucide', 'loader-2');
      statusTitle.textContent = deviceName ? `Credencial Leída • ${deviceName}` : 'Credencial Leída';
      statusTitle.style.display = 'block';
      standbyDeviceSubtitle.style.display = 'none';

      userDisplay.textContent = name || '';
      userDisplay.style.display = name ? 'block' : 'none';

      subMessage.textContent = 'Esperando respuesta de la API...';
      subMessage.style.display = 'inline-flex';

      reasonContainer.style.display = 'none';
      reasonContainer.textContent = '';

      playReadBeep();
      lucide.createIcons();

      resetTimer = setTimeout(resetToStandby, 10000);
    }

    // Trigger visual states
    function showFeedback(authorized, name, userId, reason, deviceName) {
      if (resetTimer) clearTimeout(resetTimer);

      standbyDeviceSubtitle.style.display = 'none';

      if (authorized) {
        // Success State
        screenViewport.className = 'screen state-success';
        stateIcon.setAttribute('data-lucide', 'check');
        statusTitle.textContent = deviceName ? `Acceso Autorizado • ${deviceName}` : 'Acceso Autorizado';
        userDisplay.textContent = name || '';
        userDisplay.style.display = name ? 'block' : 'none';
        subMessage.style.display = 'none';
        reasonContainer.style.display = 'none';
        
        playChime(true);
      } else {
        // Denied State
        screenViewport.className = 'screen state-denied';
        stateIcon.setAttribute('data-lucide', 'lock');
        statusTitle.textContent = deviceName ? `Acceso Denegado • ${deviceName}` : 'Acceso Denegado';
        userDisplay.textContent = name === 'Desconocido' ? 'Usuario Desconocido' : (name || '');
        userDisplay.style.display = name ? 'block' : 'none';
        subMessage.style.display = 'none';
        
        reasonContainer.textContent = reason || 'Acceso Denegado';
        reasonContainer.style.display = 'block';
        
        playChime(false);
      }

      lucide.createIcons();
      resetTimer = setTimeout(resetToStandby, 4000);
    }

    let sseSource = null;

    // Establish Server-Sent Events stream connection to the backend
    function connectSSE() {
      if (sseSource) {
        try { sseSource.close(); } catch (_) {}
        sseSource = null;
      }

      let sseUrl = '/api/logs-stream';
      if (currentDeviceId && currentDeviceId !== 'all') {
        sseUrl = `/api/devices/${encodeURIComponent(currentDeviceId)}/events-stream`;
      }

      console.log(`Conectando a flujo de eventos SSE: ${sseUrl}`);
      sseSource = new EventSource(sseUrl);

      sseSource.onmessage = function(event) {
        try {
          const data = JSON.parse(event.data);
          // Intercept access feedback events
          if (data.type === 'access_feedback') {
            // Filtrar por torniquete si la pantalla está vinculada a un torniquete específico
            if (currentDeviceId && currentDeviceId !== 'all' && data.deviceId && String(data.deviceId) !== String(currentDeviceId)) {
              return; // Omitir eventos pertenecientes a otros torniquetes
            }

            if (data.status === 'verifying') {
              showVerifying(data.name, data.userId, data.deviceName);
            } else {
              showFeedback(data.authorized, data.name, data.userId, data.reason, data.deviceName);
            }
          }
        } catch (err) {
          console.error('Error parsing SSE event data:', err);
        }
      };

      sseSource.onerror = function(err) {
        console.warn('Conexión SSE perdida o reconectando...', err);
        if (sseSource) {
          try { sseSource.close(); } catch (_) {}
          sseSource = null;
        }
        setTimeout(connectSSE, 4000);
      };
    }

    // Iniciar con detección de URL o LocalStorage
    const urlParams = new URLSearchParams(window.location.search);
    const urlDeviceParam = urlParams.get('device');
    if (urlDeviceParam) {
      currentDeviceId = urlDeviceParam;
      localStorage.setItem('feedback_device_id', urlDeviceParam);
    } else {
      const stored = localStorage.getItem('feedback_device_id');
      if (stored) {
        currentDeviceId = stored;
      } else {
        currentDeviceId = 'all';
      }
    }

    // Activar audio automáticamente en la primera interacción con la pantalla
    document.body.addEventListener('click', () => {
      if (!audioCtx) enableAudio();
    }, { once: true });

    // Close modal when clicking outside
    if (deviceModal) {
      deviceModal.addEventListener('click', (e) => {
        if (e.target === deviceModal) closeDeviceModal();
      });
    }

    // Initialize
    lucide.createIcons();
    loadDevices();
    connectSSE();
  </script>
</body>
</html>
