<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Torniquete Link</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-dark: #080b1a;
      --panel-bg: rgba(13, 20, 48, 0.45);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-blue: #00d2ff;
      --accent-blue-glow: rgba(0, 210, 255, 0.3);
      --text-main: #ffffff;
      --text-muted: #8fa0dd;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 10% 20%, rgba(0, 210, 255, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 2.5rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
      animation: fadeIn 0.6s ease-out;
    }

    .login-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: rgba(0, 210, 255, 0.1);
      border: 1px solid var(--accent-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-blue);
      box-shadow: 0 0 20px var(--accent-blue-glow);
    }

    .brand-title {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent-blue) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.75rem;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .form-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px var(--accent-blue-glow);
    }

    .btn-submit {
      width: 100%;
      padding: 0.875rem;
      background: var(--accent-blue);
      border: none;
      border-radius: 10px;
      color: #080b1a;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px var(--accent-blue-glow);
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 210, 255, 0.5);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .error-msg {
      background: rgba(255, 23, 68, 0.1);
      border: 1px solid rgba(255, 23, 68, 0.2);
      color: #ff5252;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      display: none;
      align-items: center;
      gap: 0.5rem;
      animation: shake 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <div class="brand-icon">
        <i data-lucide="shield-alert" style="width: 32px; height: 32px;"></i>
      </div>
      <h1 class="brand-title">Torniquete Link</h1>
      <p class="brand-subtitle">Panel de Acceso • Iniciar Sesión</p>
    </div>

    <form id="login-form" style="display: flex; flex-direction: column; gap: 1.25rem;">
      <div class="error-msg" id="error-box">
        <i data-lucide="alert-circle" style="width: 18px; height: 18px; flex-shrink: 0;"></i>
        <span id="error-text">Credenciales incorrectas</span>
      </div>

      <div class="form-group">
        <label for="username">Usuario o Nombre</label>
        <div class="input-wrapper">
          <i data-lucide="user" class="input-icon" style="width: 18px; height: 18px;"></i>
          <input type="text" id="username" class="form-input" placeholder="admin o nombre de recepcionista" autofocus>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <i data-lucide="lock" class="input-icon" style="width: 18px; height: 18px;"></i>
          <input type="password" id="password" class="form-input" required placeholder="••••••••">
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btn-login-submit">
        <span>Ingresar al Panel</span>
        <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
      </button>
    </form>
  </div>

  <script>
    lucide.createIcons();

    const form = document.getElementById('login-form');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const errorBox = document.getElementById('error-box');
    const errorText = document.getElementById('error-text');
    const btnSubmit = document.getElementById('btn-login-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      errorBox.style.display = 'none';
      btnSubmit.disabled = true;

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
          // Redirigir al panel principal
          window.location.href = '/';
        } else {
          errorText.textContent = data.error || 'Error al iniciar sesión';
          errorBox.style.display = 'flex';
          passwordInput.select();
        }
      } catch (err) {
        errorText.textContent = 'No se pudo conectar con el servidor';
        errorBox.style.display = 'flex';
      } finally {
        btnSubmit.disabled = false;
      }
    });
  </script>
</body>
</html>
